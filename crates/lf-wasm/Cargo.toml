[package]
name = "lf-wasm"
version.workspace = true
edition.workspace = true
description = "WebAssembly bindings for the Loop Framework audio engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lf-engine = { path = "../lf-engine" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "AudioContext",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "MessageChannel",
    "MessagePort",
    "console",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
